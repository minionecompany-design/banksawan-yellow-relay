plugins { id 'com.android.application' }

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'id.banksawan.yellow'
    compileSdk 35
    defaultConfig {
        applicationId 'id.banksawan.yellow'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.6.0-live-shadow'
        // Safe defaults: demo only, no production URL, no Binance requests.
        // CI can override YELLOW_API_BASE_URL after a secure backend exists.
        def suppliedUrl = System.getenv('YELLOW_API_BASE_URL') ?: ''
        if (suppliedUrl && !suppliedUrl.startsWith('https://')) {
            throw new GradleException('YELLOW_API_BASE_URL must use HTTPS')
        }
        buildConfigField 'String', 'API_BASE_URL', '"' + suppliedUrl + '"'
        buildConfigField 'boolean', 'DEMO_MODE', suppliedUrl ? 'false' : 'true'
        buildConfigField 'boolean', 'FCM_ENABLED', file('google-services.json').exists() ? 'true' : 'false'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Android compiles both paths; Firebase initializes only when a YELLOW config
// is provided at build time. The debug APK without config remains offline.
dependencies { implementation 'com.google.firebase:firebase-messaging:25.0.0' }
