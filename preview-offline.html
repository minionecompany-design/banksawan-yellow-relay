<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#080f19;color:#f8fafc}
*{box-sizing:border-box}body{margin:0}.phone{max-width:540px;min-height:100dvh;margin:auto;background:linear-gradient(150deg,#101b2b 0%,#080e18 65%);display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:26px 18px 14px}.topbar img{width:69px;height:69px;object-fit:cover;border-radius:15px;background:#fff}.topbar h1{font-size:24px;margin:0;letter-spacing:-.6px;line-height:1.16}.topbar h1 span{color:#f7d13d}.topbar p{font-size:12px;color:#aab6c8;margin:6px 0 0}.warning{margin:0 18px 14px;background:#3d2b0c;border:1px solid #a2771b;color:#fadd85;padding:12px 14px;border-radius:13px;font-size:12px;font-weight:800;text-align:center;letter-spacing:.1px}.bullet{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffdf64;vertical-align:middle;margin-right:4px}
.overview{display:grid;grid-template-columns:1.25fr .85fr 1fr;border:1px solid #2c3a4d;border-radius:18px;margin:0 18px 24px;background:#111b29;padding:17px 8px}.overview div{text-align:center;padding:0 6px}.overview div+div{border-left:1px solid #2e3b4f}.overview small{font-size:11px;display:block;color:#a0acc0;margin-bottom:5px}.overview strong{font-size:14px;color:#f7d13d}.overview strong#count{color:#33d292}
main{padding:0 18px 24px;flex:1}h2{margin:0 0 15px;font-size:24px}.eyebrow{color:#9babbe;font-size:12px;margin:0 0 20px}.card{border:1px solid #283a4e;border-radius:18px;background:#141e2d;padding:20px;margin-bottom:15px;box-shadow:0 8px 25px #0002}.cardTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.symbol{font-weight:900;font-size:26px;letter-spacing:-.5px;word-break:break-word}.pill{border-radius:999px;font-size:11px;font-weight:800;padding:6px 10px;background:#3e360b;color:#f9dd57;white-space:nowrap}.pill.high{background:#173c2e;color:#45de9a}.rows{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.rows label{font-size:12px;color:#95a3b9;display:block;margin-bottom:4px}.rows strong{font-size:15px;font-variant-numeric:tabular-nums}.tv{display:flex;align-items:center;justify-content:center;margin-top:18px;border-radius:12px;background:#36b4e8;color:#061b28;font-size:14px;font-weight:900;text-decoration:none;padding:14px}.tv:focus,.tab:focus{outline:2px solid #ffdf65}.footnote{margin:13px 0 0;color:#efcb69;font-size:11px;font-weight:700}
.coinRow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111b29;border:1px solid #27374a;border-radius:13px;padding:14px;margin-bottom:10px}.coinRow .symbol{font-size:16px}.coinRow .price{font-size:13px;color:#abc2d6;margin-top:4px}.coinRow .change{font-weight:900;color:#30cf97}.coinRow a{color:inherit;text-decoration:none}.empty{text-align:center;margin:65px 10px;color:#a3b1c3;font-size:15px}
footer{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:15px 18px calc(15px + env(safe-area-inset-bottom));background:#0b1422;border-top:1px solid #203047}footer button{appearance:none;border:1px solid #304257;background:#152234;color:#a6b5c9;font-size:17px;font-weight:900;padding:15px 0;border-radius:14px;cursor:pointer}footer button.active{background:#f5d13e;border-color:#f5d13e;color:#101a29}@media(min-width:550px){body{padding:24px}.phone{border:1px solid #314053;border-radius:26px;overflow:hidden;min-height:800px}}
</style>

<script>

// Demo fixtures only. No network calls occur; only TradingView shortcut opens

 {id:'DEMO_ARC',symbol:'ARCUSDT',signal:'LONG_A',timeframe:'1m',price:0.03741,binance24hChangePct:2.7,priority:'STANDARD',firstSeenMs:sampleStart-97*60000,homeExpiresMs:sampleStart+22*3600000+23*60000,status:'DEMO_ONLY'}
];
const demoUniverse=[
 {symbol:'WALUSDT',price:0.05123,binance24hChangePct:5.8,priority:'HIGH'},
 {symbol:'ARCUSDT',price:0.03741,binance24hChangePct:2.7,priority:'STANDARD'},
 {symbol:'NILUSDT',price:0.08511,binance24hChangePct:1.5,priority:'STANDARD'}

const $=q=>document.querySelector(q);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
const pct=n=>`${n>=0?'+':''}${Number(n).toFixed(2)}%`;
const money=n=>Number(n).toFixed(Number(n)<1?6:3);
const time=t=>new Date(t).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
// Only known Binance USD-M symbols may form TradingView chart URLs.
const tv=s=>/^[A-Z0-9]{2,25}USDT$/.test(s)?`https://www.tradingview.com/chart/?symbol=${encodeURIComponent('BINANCE:'+s+'.P')}`:null;
let currentTab='home';
function row(parent,key,val){const d=el('div');d.append(el('label',null,key),el('strong',null,val));parent.append(d)}
function link(symbol){const a=el('a','tv','BUKA TRADINGVIEW ↗');a.href=tv(symbol)||'#';a.target='_blank';a.rel='noopener noreferrer';return a}
function homeCard(item){const c=el('article','card'),head=el('div','cardTitle');head.append(el('div','symbol',item.symbol),el('span','pill '+(item.priority==='HIGH'?'high':''),item.priority==='HIGH'?'+5% PRIORITAS':'LONG A'));
 c.append(head);const r=el('div','rows');row(r,'Timeframe LONG A (DEMO)',String(item.timeframe||'1m').toUpperCase());row(r,'Harga sinyal (DEMO)',money(item.price));row(r,'Perubahan 24h (DEMO)',pct(item.binance24hChangePct));row(r,'Tampil sejak',time(item.firstSeenMs));row(r,'Hilang dari HOME',time(item.homeExpiresMs));c.append(r,link(item.symbol),el('p','footnote','SIMULASI — bukan rekomendasi entry atau harga real-time'));return c}
function universeRow(item){const div=el('div','coinRow');const l=el('div');l.append(el('div','symbol',item.symbol),el('div','price',money(item.price)+' USDT · '+(item.priority==='HIGH'?'Prioritas +5%':'Dipantau +1%')));const a=el('a','change',pct(item.binance24hChangePct));a.href=tv(item.symbol)||'#';a.target='_blank';a.rel='noopener noreferrer';div.append(l,a);return div}
async function refresh(){try{const [home,universe]=await Promise.all([fetch('/api/home').then(x=>x.json()),fetch('/api/universe').then(x=>x.json())]);
 $('#status').textContent='DEMO OFFLINE';$('#count').textContent=universe.universe.length+' KOIN';
 const panel=$('#panel');panel.replaceChildren();panel.append(el('h2',null,currentTab==='home'?'HOME':'UNIVERSE'),el('p','eyebrow',currentTab==='home'?'LONG A · Setiap kandidat 24 jam, dihitung sendiri':'Harga <10 USDT · Binance 24h ≥ +1% · Prioritas ≥ +5%'));
 const items=currentTab==='home'?home.home:universe.universe;
 if(!items.length)panel.append(el('p','empty','Belum ada sinyal yang tersedia'));
 for(const item of items)panel.append(currentTab==='home'?homeCard(item):universeRow(item));
}catch(err){$('#panel').replaceChildren(el('p','empty','Server demo tidak tersedia'));$('#status').textContent='OFFLINE';}}
for(const b of document.querySelectorAll('footer button'))b.addEventListener('click',()=>{currentTab=b.dataset.tab;for(const other of document.querySelectorAll('footer button'))other.classList.toggle('active',other===b);refresh()});
refresh();setInterval(refresh,60_000);
