name: BANKSAWAN YELLOW v0.15 permanently signed OFFLINE HOLD (build-only)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed YELLOW source commit (40 hexadecimal characters)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: yellow-permanent-signed-apk
  cancel-in-progress: false
jobs:
  build:
    name: Build v0.15 OFFLINE HOLD; no deploy or market access
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YELLOW_SOURCE_SHA: ${{ inputs.source_sha }}
      YELLOW_API_BASE_URL: ''
      YELLOW_ALERTS_ENABLED: 'false'
      YELLOW_RELEASE_SIGNING: 'true'
      EXPECTED_FIREBASE_PROJECT_ID: ${{ secrets.YELLOW_FIREBASE_PROJECT_ID }}
      YELLOW_FIREBASE_CONFIG_B64: ${{ secrets.YELLOW_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
      YELLOW_SIGNING_KEYSTORE_B64: ${{ secrets.YELLOW_SIGNING_KEYSTORE_B64 }}
      YELLOW_SIGNING_STORE_PASSWORD: ${{ secrets.YELLOW_SIGNING_STORE_PASSWORD }}
      YELLOW_SIGNING_CERT_SHA256: ${{ secrets.YELLOW_SIGNING_CERT_SHA256 }}
    steps:
      - name: Require an exact reviewed source commit and all signing inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          if not re.fullmatch(r'[0-9a-fA-F]{40}',os.environ.get('YELLOW_SOURCE_SHA','')):
              raise SystemExit('EXACT_SOURCE_SHA_REQUIRED')
          for name in ['EXPECTED_FIREBASE_PROJECT_ID','YELLOW_FIREBASE_CONFIG_B64','YELLOW_SIGNING_KEYSTORE_B64','YELLOW_SIGNING_STORE_PASSWORD','YELLOW_SIGNING_CERT_SHA256']:
              if not os.environ.get(name): raise SystemExit('MISSING_INPUT: '+name)
          if not re.fullmatch(r'[0-9a-fA-F]{64}',os.environ['YELLOW_SIGNING_CERT_SHA256'].replace(':','').strip()):
              raise SystemExit('INVALID_CERTIFICATE_FINGERPRINT')
          PY
      - name: Checkout exact source; never deploy or move a branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify source receipt and prepare protected temporary inputs
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$YELLOW_SOURCE_SHA"
          git rev-parse HEAD > source-commit.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import os,base64,pathlib
          store=pathlib.Path(os.environ['RUNNER_TEMP'])/'yellow-permanent.p12'
          store.write_bytes(base64.b64decode(os.environ['YELLOW_SIGNING_KEYSTORE_B64'],validate=True))
          store.chmod(0o600)
          config=pathlib.Path('android/app/google-services.json')
          config.write_bytes(base64.b64decode(os.environ['YELLOW_FIREBASE_CONFIG_B64'],validate=True))
          config.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('YELLOW_SIGNING_STORE_FILE='+str(store)+'\n')
          PY
          python3 scripts/verify-yellow-firebase.py android/app/google-services.json "$EXPECTED_FIREBASE_PROJECT_ID"
          # Offline hold must not embed Firebase auto-initialization resources.
          rm -f android/app/google-services.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify private keystore matches the pinned public certificate
        shell: bash
        run: |
          keytool -exportcert -keystore "$YELLOW_SIGNING_STORE_FILE" -storetype PKCS12 -alias yellow-permanent -storepass:env YELLOW_SIGNING_STORE_PASSWORD -file "$RUNNER_TEMP/yellow-public.cer"
          python3 - <<'PY'
          import os,pathlib,hashlib,hmac
          digest=hashlib.sha256((pathlib.Path(os.environ['RUNNER_TEMP'])/'yellow-public.cer').read_bytes()).hexdigest()
          expected=os.environ['YELLOW_SIGNING_CERT_SHA256'].replace(':','').strip().lower()
          if not hmac.compare_digest(digest,expected): raise SystemExit('KEYSTORE_CERTIFICATE_MISMATCH')
          pathlib.Path('signer-sha256.txt').write_text(digest.upper()+'\n')
          print('YELLOW_KEYSTORE_CERTIFICATE_PASS')
          PY
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build the one YELLOW release variant
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace
      - name: Verify OFFLINE HOLD, integrity, exact version and release mode
        shell: bash
        run: |
          CONFIG=android/app/build/generated/source/buildConfig/release/id/banksawan/yellow/BuildConfig.java
          test -s "$CONFIG"
          grep -Eq 'DEMO_MODE[[:space:]]*=[[:space:]]*true' "$CONFIG"
          grep -Eq 'ALERTS_ENABLED[[:space:]]*=[[:space:]]*false' "$CONFIG"
          grep -Eq 'FCM_ENABLED[[:space:]]*=[[:space:]]*false' "$CONFIG"
          export YELLOW_APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          python3 scripts/verify-yellow-apk-signature.py android/app/build/outputs/apk/release/app-release.apk "$YELLOW_SIGNING_CERT_SHA256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/yellow-release-badging.txt"
          grep -q "package: name='id.banksawan.yellow'" "$RUNNER_TEMP/yellow-release-badging.txt"
          if grep -q application-debuggable "$RUNNER_TEMP/yellow-release-badging.txt"; then exit 1; fi
          python3 scripts/verify-yellow-v015-release.py "$RUNNER_TEMP/yellow-release-badging.txt" "$CONFIG"
          sha256sum android/app/build/outputs/apk/release/app-release.apk > apk-sha256.txt
      - name: Upload signed APK and public receipts only
        uses: actions/upload-artifact@v4
        with:
          name: banksawan-yellow-v015-permanent-OFFLINE-HOLD
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            source-commit.txt
            apk-sha256.txt
            signer-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary private key and Firebase configuration
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yellow-permanent.p12" android/app/google-services.json

