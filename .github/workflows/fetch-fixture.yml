const REQUEST_PAUSE_MS = 120;
const MAX_RETRIES = 4;

// ============================================================
// FIXTURE WINDOWS
//
// UTC, end date exclusive.
//
// Expected EARLY prices DO NOT live here.
// These windows select raw historical candles only.
// ============================================================

