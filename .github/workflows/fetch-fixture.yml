name: Fetch Regression Fixtures

on:
  push:
    branches:
      - early-engine-v2
    paths:
      - ".github/workflows/fetch-fixture.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout early-engine-v2
        uses: actions/checkout@v4
        with:
          ref: early-engine-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Binance historical candles
        run: node scripts/fetch-regression-fixtures.js

      - name: Verify generated fixtures
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          for (const name of ["apr", "useless", "btr"]) {
            const file = `test/fixtures/${name}.json`;

            if (!fs.existsSync(file)) {
              throw new Error(`Missing ${file}`);
            }

            const data = JSON.parse(
              fs.readFileSync(file, "utf8")
            );

            console.log(`\n=== ${data.symbol} ===`);

            for (const tf of ["1m", "5m", "15m", "1h"]) {
              const candles = data.tf?.[tf];

              if (
                !Array.isArray(candles) ||
                candles.length === 0
              ) {
                throw new Error(
                  `${data.symbol}: missing ${tf}`
                );
              }

              const lows = candles.map(c => c.low);
              const highs = candles.map(c => c.high);

              console.log(
                `${tf}: candles=${candles.length} ` +
                `min=${Math.min(...lows)} ` +
                `max=${Math.max(...highs)}`
              );
            }
          }
          NODE

      - name: Commit generated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add test/fixtures/

          if git diff --cached --quiet; then
            echo "No fixture changes to commit."
          else
            git commit -m "Add Binance regression fixtures"
            git push origin HEAD:early-engine-v2
          fi
