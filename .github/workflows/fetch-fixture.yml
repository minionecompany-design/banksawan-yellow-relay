name: Refresh Early Engine Fixtures

on:
  workflow_dispatch:
    inputs:
      target:
        description: Fixture to refresh
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - APR
          - BTR
          - USELESS

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch chronological Binance candles
        shell: bash
        run: |
          if [ "${{ inputs.target }}" = "ALL" ]; then
            node scripts/fetch-regression-fixtures.js
          else
            node scripts/fetch-regression-fixtures.js "${{ inputs.target }}"
          fi

      - name: Upload generated fixtures
        uses: actions/upload-artifact@v4
        with:
          name: early-engine-fixtures-${{ inputs.target }}
          path: test/fixtures/*.json.gz
          if-no-files-found: error
          retention-days: 7
