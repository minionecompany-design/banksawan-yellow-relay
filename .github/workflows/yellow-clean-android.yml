name: YELLOW clean Android QA (offline only)
on:
  pull_request:
    paths:
      - 'clean-rebuild/android/**'
      - '.github/workflows/yellow-clean-android.yml'
permissions:
  contents: read
jobs:
  android-debug-contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already provides ANDROID_HOME and installed SDK tooling.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android clean module JVM tests
        working-directory: clean-rebuild/android
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Android clean debug only compile
        working-directory: clean-rebuild/android
        run: gradle --no-daemon :app:assembleDebug
