name: YELLOW clean Android QA (offline only)
on:
  pull_request:
    paths:
      - 'clean-rebuild/android/**'
      - '.github/workflows/yellow-clean-android.yml'
permissions:
  contents: read
jobs:
  android-debug-contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already provides ANDROID_HOME and installed SDK tooling.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android clean module JVM tests
        working-directory: clean-rebuild/android
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Android clean debug only compile
        working-directory: clean-rebuild/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Assert QA cannot replace installed production package
        working-directory: clean-rebuild/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -Fq "name='id.banksawan.yellow.qa'"
          if echo "$BADGING" | grep -Fq "name='id.banksawan.yellow'"; then
            echo 'Unsafe production package in QA artifact' >&2; exit 1
          fi
      - name: Upload offline-only debug APK for manual QA
        uses: actions/upload-artifact@v4
        with:
          name: yellow-clean-OFFLINE-DEBUG-NOT-RELEASE
          path: clean-rebuild/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-clean.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline emulator HOME/UNIVERSE navigation (360dp + 412dp)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r clean-rebuild/android/app/build/outputs/apk/debug/app-debug.apk
            python3 clean-rebuild/android/qa/emulator-smoke.py
      - name: Preserve emulator screenshots and hierarchy even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-clean-android-offline-emulator-evidence
          path: clean-rebuild/android/qa/screenshots/
          if-no-files-found: warn
