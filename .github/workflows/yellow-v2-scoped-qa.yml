name: YELLOW V2 scoped update QA (offline only)
on:
  push:
    branches: [fix/yellow-v2-4tf-50-q10m-20261022, 'feat/yellow-analysis-companion-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scanner syntax
        run: |
          node --check scanner/src/long-a.js
          node --check scanner/src/live-market.js
          node --check scanner/src/live-home-ledger.js
          node --check scanner/src/live-fcm.js
          node --check scanner/src/parallel-long-a.js
          node --check scanner/src/analysis-companion.js
          node --check scanner/src/analysis-companion-bridge.js
          node --check scanner/src/analysis-companion-store.js
          node --check scanner/scripts/audit-v2-api-contract.mjs
          node --check scanner/scripts/lib/v2-api-contract.mjs
      - name: Offline scanner regression (no Binance, Railway, FCM sends)
        run: node --test scanner/test/*.test.js
      - name: Android source policy contract
        run: node --test scanner/test/v2-final-policy.test.js
      - name: Original V2 signer and in-place upgrade policy (offline)
        run: python3 -m unittest discover -s scripts -p 'test_verify_yellow*.py'
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile YELLOW Android candidate (NO APK distribution)
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Android behavior QA (Robolectric, no phone or real FCM)
        run: gradle -p android :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Preserve Android test evidence (NO APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-v2-android-unit-test-evidence
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14
      - name: Validate same package and planned update version
        run: |
          grep -q "applicationId 'id.banksawan.yellow'" android/app/build.gradle
          grep -q 'versionCode 11' android/app/build.gradle
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Signing protection cannot be bypassed without permanent key
        run: |
          if gradle -p android :app:assembleRelease --no-daemon > "$RUNNER_TEMP/release-probe.log" 2>&1; then
            echo 'Unsafe unsigned release accepted'; exit 1
          fi
          grep -q YELLOW_PERMANENT_SIGNING_REQUIRED "$RUNNER_TEMP/release-probe.log"
