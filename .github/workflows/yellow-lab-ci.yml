name: YELLOW LAB isolated CI
on:
  push:
    branches: [lab/yellow-lab-live-shadow-20261021]
  workflow_dispatch:
jobs:
  lab-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm test
        working-directory: lab/scanner
  lab-android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: lab/android
      - uses: actions/upload-artifact@v4
        with: {name: yellow-lab-v0.4-debug-UNSIGNED, path: lab/android/app/build/outputs/apk/debug/*.apk}
