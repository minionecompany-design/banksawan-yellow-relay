
name: YELLOW Android Debug APK (offline)

on:
  push:
    branches:
      - yellow-long-a-v2-20261015
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build offline debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      YELLOW_API_BASE_URL: ''

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build YELLOW debug APK
        run: |
          gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: banksawan-yellow-v4-debug-demo
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
