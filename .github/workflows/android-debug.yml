name: BANKSAWAN YELLOW V7 LIVE SHADOW APK

on:
  push:
    branches:
      - yellow-long-a-v2-20261015
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-live-shadow-apk:
    name: Build V7 live shadow (alerts off)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YELLOW_API_BASE_URL: 'https://yellow-live-shadow-yc94-production.up.railway.app'
      YELLOW_ALERTS_ENABLED: 'true'

    steps:
      - name: Checkout YELLOW branch
        uses: actions/checkout@v4

      - name: Verify live URL and notification safety
        run: |
          test "$YELLOW_API_BASE_URL" = 'https://yellow-live-shadow-yc94-production.up.railway.app'
          test "$YELLOW_ALERTS_ENABLED" = 'true'
          echo 'YELLOW LIVE SHADOW URL configured; notifications OFF.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK 35
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build YELLOW V7 LIVE SHADOW debug APK
        run: |
          gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload live shadow APK
        uses: actions/upload-artifact@v4
        with:
          name: banksawan-yellow-v8-SOUND-PROOF-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
